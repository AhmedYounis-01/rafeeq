org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Stable compilation for Windows environments (reduces TCP/IP daemon failures)
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx1024M
org.gradle.parallel=false
