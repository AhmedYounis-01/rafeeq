# ── Gradle JVM: reduced from 2560M to fix Kotlin daemon crash on low-RAM machines ──
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Use daemon strategy (separate process) to prevent "Could not connect to Kotlin compile daemon" crash
kotlin.compiler.execution.strategy=daemon
# Keep Gradle daemon alive between builds for faster re-runs
org.gradle.daemon=true
# Disable parallel to reduce memory spikes
org.gradle.parallel=false
